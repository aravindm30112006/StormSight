version: "3.9"

# ============================================================
#  ThunderCast — AI Thunderstorm & Lightning Nowcasting System
#  SIH 26072 | Ministry of Earth Sciences (MoES)
# ============================================================

services:
  # ── Backend: FastAPI + PyTorch inference engine ──────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thundercast-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_DEVICE=cpu
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend: React + Vite dashboard ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thundercast-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_WS_URL=ws://localhost:8000/ws/nowcast
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: thundercast-net
